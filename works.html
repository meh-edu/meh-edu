<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>MEH | أعمالي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Cairo', sans-serif;
      background:#0f172a;
      color:#e5e7eb;
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:50px 20px;
    }
    h1{
      color:#38bdf8;
      text-align:center;
      margin-bottom:40px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }
    .item{
      background:#020617;
      border:1px solid #1e293b;
      border-radius:16px;
      overflow:hidden;
    }
    .item img, .item iframe{
      width:100%;
      display:block;
    }
    .item .info{
      padding:14px;
      font-size:0.95rem;
      color:#94a3b8;
    }
    a.back{
      display:inline-block;
      margin-bottom:25px;
      color:#fbbf24;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>

<body>
  <div class="container">
    <a class="back" href="index.html">← الرجوع للرئيسية</a>
    <h1>أعمالي</h1>

    <div id="works" class="grid"></div>
  </div>

<script>
fetch('data/works.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('works');
    data.forEach(item => {
      let content = '';

      if(item.type === 'image'){
        content = `<img src="${item.src}" alt="">`;
      }
      if(item.type === 'pdf'){
        content = `<iframe src="${item.src}" height="350"></iframe>`;
      }
      if(item.type === 'video'){
        content = `<iframe src="${item.src}" height="315" allowfullscreen></iframe>`;
      }

      container.innerHTML += `
        <div class="item">
          ${content}
          <div class="info">${item.title}</div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
