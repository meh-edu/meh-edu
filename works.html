<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>MEH | أعمالي</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Cairo', sans-serif;
      background:#0f172a;
      color:#e5e7eb;
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:50px 20px;
    }
    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:40px;
    }
    .back{
      display:inline-block;
      margin-bottom:25px;
      color:#fbbf24;
      text-decoration:none;
      font-weight:600;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }
    .item{
      background:#020617;
      border:1px solid #1e293b;
      border-radius:16px;
      overflow:hidden;
    }
    .item img,
    .item iframe{
      width:100%;
      display:block;
      border:none;
    }
    .item iframe{
      height:320px;
    }
    .info{
      padding:14px;
      text-align:center;
      font-size:0.95rem;
      color:#94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="index.html" class="back">← الرجوع للرئيسية</a>
    <h1>أعمالي</h1>

    <!-- ستظهر الأعمال هنا -->
    <div id="works" class="grid"></div>
  </div>

<script>
fetch('data/works.json?v=' + new Date().getTime())
  .then(r => r.json())
  .then(list => {
    const box = document.getElementById('works');

    list.forEach(w => {
      let media = '';

      if (w.type === 'image') {
        media = `<img src="${w.src}" alt="">`;
      }
      if (w.type === 'pdf') {
        media = `<iframe src="${w.src}"></iframe>`;
      }
      if (w.type === 'video') {
        media = `<iframe src="${w.src}" allowfullscreen></iframe>`;
      }

      box.innerHTML += `
        <div class="item">
          ${media}
          <div class="info">${w.title}</div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
